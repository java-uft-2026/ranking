name: Vigiar envios dos alunos

# Roda a cada 5 minutos (repositório público = minutos grátis).
# Se algum aluno fez push depois da última correção, dispara o corretor na hora.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: vigiar
  cancel-in-progress: true

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar envios e disparar o corretor
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request
          ORG, PRE, CORR = "java-uft-2026", "lista-java-", "corretor"
          IGNORAR = {"lista-java-template", "lista-java-teste"}
          tok = os.environ["GH_TOKEN"]
          def api(path, method="GET", data=None):
              req = urllib.request.Request("https://api.github.com" + path, method=method,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  t = r.read().decode()
                  return json.loads(t) if t else {}
          runs = api(f"/repos/{ORG}/{CORR}/actions/workflows/corrigir.yml/runs?per_page=5")["workflow_runs"]
          if any(r["status"] in ("queued", "in_progress", "waiting", "pending") for r in runs):
              print("Correção já em andamento."); raise SystemExit
          ultima = max((r["run_started_at"] or r["created_at"] for r in runs if r["conclusion"] == "success"), default="")
          novos, pagina = 0, 1
          while True:
              lote = api(f"/orgs/{ORG}/repos?per_page=100&page={pagina}&type=all")
              if not lote: break
              novos += sum(1 for r in lote if r["name"].startswith(PRE) and r["name"] not in IGNORAR
                           and not r["archived"] and (r["pushed_at"] or "") > ultima)
              pagina += 1
          if novos:
              api(f"/repos/{ORG}/{CORR}/actions/workflows/corrigir.yml/dispatches", "POST", {"ref": "main"})
              print(f"{novos} repositório(s) com envio novo: correção disparada.")
          else:
              print("Nenhum envio novo.")
